    // 카테고리: 띄어쓰기 차이만 통일
    const catCount = {}; let uncategorized = 0;
    items.forEach((x) => { if (x.category === '미분류') { uncategorized++; return; } const k = x.category.replace(/\s+/g, ''); catCount[k] = (catCount[k] || 0) + 1; });
    const topCat = Object.entries(catCount).sort((a, b) => b[1] - a[1]).slice(0, 10);
    $('#catHint').textContent = `· 미입력 ${uncategorized}건 제외`;
    hbar($('#cCat'), topCat, palette[0]);
    // 플랫폼: "IG 릴스, YT숏츠" 처럼 여러 개면 각각 집계
    const platCount = {}; let noPlat = 0;
    items.forEach((x) => { const ps = x.platform.split(/[,/]/).map((s) => s.trim()).filter(Boolean); if (!ps.length) noPlat++; ps.forEach((p) => { platCount[p] = (platCount[p] || 0) + 1; }); });
    $('#platHint').textContent = `· 미입력 ${noPlat}건 제외`;
    hbar($('#cPlat'), Object.entries(platCount).sort((a, b) => b[1] - a[1]), palette[2]);

    // 목록
    const sorted = [...items].sort((a, b) => (b.date || 0) - (a.date || 0) || b.row - a.row);
    const drawTable = () => {
      const q = $('#q').value.trim().toLowerCase(), ft = $('#fType').value, fm = $('#fMonth').value;
      const list = sorted.filter((x) => (!ft || x.type === ft) && (!fm || x.month === fm) &&
        (!q || [x.brand, x.agency, x.product, x.category, x.note, x.status, x.platform].join(' ').toLowerCase().includes(q)));
      $('#listCount').textContent = `${list.length}건`;
      $('#tbody').innerHTML = list.slice(0, state.tableLimit).map((x, i) => `
        <tr data-i="${i}">
          <td class="nowrap" data-label="문의일">${x.date ? `${x.date.getFullYear() % 100}.${x.date.getMonth() + 1}.${x.date.getDate()}` : esc(x.rawDate || '—')}</td>
          <td data-label="유형"><span class="pill ty-${esc(x.type.replace(/[()\s]/g, ''))}">${esc(x.type)}</span></td>
          <td class="brandcell" data-label="브랜드"><b>${esc(x.brand || '—')}</b></td>
          <td data-label="대행사">${esc(x.agency)}</td>
          <td data-label="카테고리">${x.category === '미분류' ? '' : esc(x.category)}</td>
          <td class="wrap" data-label="제품명">${esc(x.product)}</td>
          <td data-label="플랫폼">${esc(x.platform)}</td>
          <td class="wrap" data-label="소통">${esc(x.status)}</td>
          <td data-label="확정">${x.done ? '✅ 완료' : esc(x.confirm)}</td>
        </tr>`).join('') || '<tr><td colspan="9" class="empty">조건에 맞는 문의가 없어요</td></tr>';
      $('#more').innerHTML = list.length > state.tableLimit ? `<button class="btn" id="moreBtn">더 보기 (${list.length - state.tableLimit}건 남음)</button>` : '';
      if ($('#moreBtn')) $('#moreBtn').onclick = () => { state.tableLimit += 50; drawTable(); };
      $('#tbody').querySelectorAll('tr[data-i]').forEach((tr) => {
        tr.onclick = () => {
          const nx = tr.nextElementSibling;
          if (nx && nx.classList.contains('detail')) { nx.remove(); return; }
          const x = list[+tr.dataset.i];
          const f = [['문의 경로', x.route], ['업로드 채널', x.channel], ['희망 일정', x.wish], ['정산 일정', x.settle], ['진행 단가(VAT 제외)', x.price], ['담당자', x.contact], ['비고', x.note], ['시트 위치', x.row + '행']].filter((v) => v[1]);
          tr.insertAdjacentHTML('afterend', `<tr class="detail"><td colspan="9"><div class="detail-grid">${f.map(([k, v]) => `<div><span>${k}</span>${esc(v)}</div>`).join('')}</div></td></tr>`);
        };
      });
    };
    ['q', 'fType', 'fMonth'].forEach((id) => { $('#' + id).oninput = () => { state.tableLimit = 50; drawTable(); }; });
    drawTable();
  }

  function hbar(el, entries, color) {
    if (!entries.length) { el.parentElement.innerHTML = '<div class="empty">입력된 값이 없어요</div>'; return; }
    chart(el, {
      type: 'bar',
      data: { labels: entries.map((e) => e[0]), datasets: [{ data: entries.map((e) => e[1]), backgroundColor: color, borderRadius: 4, maxBarThickness: 18 }] },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { precision: 0 } }, y: { grid: { display: false } } }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ` ${c.parsed.x}건` } } } }
    });
  }

  /* ================= 채널 성과 ================= */
  const fmt = (n) => (n == null ? '–' : Math.round(n).toLocaleString('ko-KR'));
  function kfmt(n) { // 123,456,789 → 1.2억 / 1,234,567 → 123만
    if (n == null) return '–';
    const a = Math.abs(n);
    if (a >= 1e8) return (n / 1e8).toFixed(a >= 1e9 ? 0 : 1).replace(/\.0$/, '') + '<small>억</small>';
    if (a >= 1e4) return (a >= 1e6 ? Math.round(n / 1e4).toLocaleString('ko-KR') : (n / 1e4).toFixed(1).replace(/\.0$/, '')) + '<small>만</small>';
    return n.toLocaleString('ko-KR');
  }
  function renderPerformance(rows, head) {
    const R = P.parsePerformance(rows, state.creator.name);
    if (!R.metrics.length) throw new Error('지표 데이터(구분 열)가 없습니다.');
    const find = (re) => R.metrics.find((m) => re.test(m.name));
    const fol = find(/팔로워/), views = find(/조회/), react = find(/반응/), target = find(/타깃|타겟/);
    const numeric = R.metrics.filter((m) => m.months.some((x) => x.num != null));
    // 데이터가 있는 마지막 달
    let last = -1;
    R.metrics.forEach((m) => m.months.forEach((x, k) => { if (x.num != null || x.pct != null) last = Math.max(last, k); }));
    const M = Array.from({ length: last + 1 }, (_, k) => `${k + 1}월`);
    const series = (m) => (m ? m.months.slice(0, last + 1).map((x) => x.num) : []);
    const sum = (m) => m.months.reduce((s, x) => s + (x.num || 0), 0);
    const lastVal = (m) => { for (let k = last; k >= 0; k--) if (m.months[k].num != null) return { k, v: m.months[k].num }; return null; };
    const change = (m) => {
      const lv = lastVal(m); if (!lv) return '';
      const pv = lv.k > 0 ? m.months[lv.k - 1].num : null;
      return `${lv.k + 1}월 ${fmt(lv.v)}` + (pv ? ` · 전월 대비 ${lv.v >= pv ? '▲' : '▼'} ${(() => { const r = Math.abs(((lv.v - pv) / pv) * 100); return r < 10 ? r.toFixed(1) : Math.round(r); })()}%` : '');
    };
    // 반응률 = 반응수 ÷ 조회수 (두 값이 모두 있는 달만)
    const rate = views && react ? views.months.slice(0, last + 1).map((x, k) => (x.num && react.months[k].num != null ? (react.months[k].num / x.num) * 100 : null)) : [];
    const both = rate.map((r, k) => (r == null ? null : k)).filter((k) => k != null);
    const avgRate = both.length ? (both.reduce((s, k) => s + react.months[k].num, 0) / both.reduce((s, k) => s + views.months[k].num, 0)) * 100 : null;
    // "[2534] 30.4%", "25-34 33.4%", "여성 85%" → 항목(25-34 / 여성)별로 나눔
    const tLabel = (raw) => {
      const m = (raw || '').match(/^(.*?)\s*-?\d+(?:\.\d+)?\s*%/); if (!m) return null;
      let l = m[1].replace(/[\[\]()]/g, '').trim();
      if (/^\d{4}$/.test(l)) l = `${l.slice(0, 2)}-${l.slice(2)}`;
      return l || '비중';
    };
    const tgtGroups = {};
    if (target) target.months.slice(0, last + 1).forEach((x, k) => {
      const l = tLabel(x.raw); if (l == null || x.pct == null) return;
      (tgtGroups[l] = tgtGroups[l] || Array(last + 1).fill(null))[k] = x.pct;
    });
    const tgtPct = target ? target.months.slice(0, last + 1).map((x) => x.pct) : [];
    const tgtLast = target ? (() => { for (let k = last; k >= 0; k--) if (target.months[k].raw && target.months[k].raw !== '-') return { k, raw: target.months[k].raw }; return null; })() : null;
    const tgtVals = tgtPct.filter((v) => v != null);
    const tgtLastLabel = tgtLast ? tLabel(tgtLast.raw) : null;
    const sameVals = tgtLastLabel && tgtGroups[tgtLastLabel] ? tgtGroups[tgtLastLabel].filter((v) => v != null) : [];

    // 빈칸·'-' 안내
    const gaps = numeric.map((m) => {
      const g = m.months.slice(0, last + 1).map((x, k) => (x.num == null ? `${k + 1}월${x.raw ? `(${x.raw})` : '(빈칸)'}` : null)).filter(Boolean);
      return g.length ? `${esc(m.name)}: ${g.join(', ')}` : null;
    }).filter(Boolean);

    $('#view').innerHTML = head +
      (!R.matched && R.creators.length ? `<div class="banner">ℹ️ 시트에서 “${esc(state.creator.name)}” 이름을 찾지 못해 “${esc(R.creator)}” 데이터를 표시합니다.</div>` : '') +
      (gaps.length ? `<div class="banner">ℹ️ 값이 없는 달은 차트에서 비워 두고 계산에서 제외했어요 — ${gaps.join(' / ')}</div>` : '') + `
      <div class="kpis">
        ${fol ? kpi('👥 ' + esc(fol.name) + ' 누적', fmt(fol.acc ?? sum(fol)), change(fol), true) : ''}
        ${views ? kpi('▶️ ' + esc(views.name) + ' 누적', kfmt(views.acc ?? sum(views)), `${fmt(views.acc ?? sum(views))}회 · ${change(views)}`) : ''}
        ${react ? kpi('💬 ' + esc(react.name) + ' 누적', kfmt(react.acc ?? sum(react)), avgRate != null ? `평균 반응률 ${avgRate.toFixed(1)}% (반응수÷조회수)` : change(react)) : ''}
        ${target ? kpi('🎯 ' + esc(target.name), tgtLast ? esc(tgtLast.raw) : '–', tgtLast ? `${tgtLast.k + 1}월 기준${sameVals.length > 1 ? ` · ${esc(tgtLastLabel)} 평균 ${(sameVals.reduce((a, b) => a + b, 0) / sameVals.length).toFixed(1)}%` : ''}${Object.keys(tgtGroups).length > 1 ? ` · 기준 ${Object.keys(tgtGroups).length}종 혼합` : ''}` : '') : ''}
      </div>
      <div class="grid-2" style="margin-top:12px">
        <div class="panel"><h3>월별 조회수 · 반응수</h3><div class="chart-box"><canvas id="pViews"></canvas></div></div>
        <div class="panel"><h3>월별 ${esc(fol ? fol.name : '팔로워')}</h3><div class="chart-box"><canvas id="pFol"></canvas></div></div>
      </div>
      <div class="grid-2 even" style="margin-top:12px">
        <div class="panel"><h3>월별 반응률 <span style="font-weight:400;color:var(--muted);font-size:12px">· 반응수 ÷ 조회수</span></h3><div class="chart-box"><canvas id="pRate"></canvas></div></div>
        <div class="panel"><h3>${esc(target ? target.name : '주요 타깃')} 추이</h3><div class="chart-box"><canvas id="pTgt"></canvas></div></div>
      </div>
      <div class="section-title"><h2>월별 데이터</h2><span class="hint">검증: 1~12월 합계 = 시트 ‘누적’ 값</span></div>
      <div class="table-wrap scroll"><table>
        <thead><tr><th class="stick">구분</th><th>누적</th>${Array.from({ length: 12 }, (_, k) => `<th>${k + 1}월</th>`).join('')}<th>검증</th></tr></thead>
        <tbody>${R.metrics.map((m) => {
          const isNum = m.months.some((x) => x.num != null);
          const s = sum(m);
          const ok = !isNum ? '—' : m.acc == null ? '누적 없음' : s === m.acc ? '✅ 일치' : `⚠️ 차이 ${fmt(m.acc - s)}`;
          return `<tr><td class="stick nowrap"><b>${esc(m.name)}</b></td><td class="nowrap">${esc(m.accRaw || '')}</td>${m.months.map((x) => `<td class="nowrap">${esc(x.raw)}</td>`).join('')}<td class="nowrap">${ok}</td></tr>`;
        }).join('')}</tbody></table></div>`;

    const c1 = cssVar('--accent'), c2 = cssVar('--upload'), c3 = cssVar('--shoot'), c4 = cssVar('--final');
    const base = { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, boxHeight: 10 } } } };
    const noData = (id) => { $(id).parentElement.innerHTML = '<div class="empty">데이터가 없어요</div>'; };
    if (views || react) chart($('#pViews'), {
      data: { labels: M, datasets: [
        views && { type: 'bar', label: views.name, data: series(views), backgroundColor: c1, borderRadius: 4, maxBarThickness: 34, yAxisID: 'y', order: 2 },
        react && { type: 'line', label: react.name, data: series(react), borderColor: c3, backgroundColor: c3, tension: .3, pointRadius: 3, spanGaps: false, yAxisID: 'y1', order: 1 }
      ].filter(Boolean) },
      options: { ...base, scales: { x: { grid: { display: false } }, y: { position: 'left', ticks: { callback: (v) => (v >= 1e4 ? v / 1e4 + '만' : v) } }, y1: { position: 'right', grid: { display: false }, ticks: { callback: (v) => (v >= 1e4 ? v / 1e4 + '만' : v) } } },
        plugins: { ...base.plugins, tooltip: { callbacks: { label: (c) => ` ${c.dataset.label}: ${c.parsed.y == null ? '데이터 없음' : fmt(c.parsed.y)}` } } } }
    }); else noData('#pViews');
    if (fol) chart($('#pFol'), {
      type: 'bar',
      data: { labels: M, datasets: [{ label: fol.name, data: series(fol), backgroundColor: c2, borderRadius: 4, maxBarThickness: 34 }] },
      options: { ...base, plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ` ${fmt(c.parsed.y)}명` } } }, scales: { x: { grid: { display: false } } } }
    }); else noData('#pFol');
    if (rate.some((v) => v != null)) chart($('#pRate'), {
      type: 'line',
      data: { labels: M, datasets: [{ label: '반응률', data: rate, borderColor: c3, backgroundColor: c3, tension: .3, pointRadius: 3 }] },
      options: { ...base, plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ` ${c.parsed.y == null ? '데이터 없음' : c.parsed.y.toFixed(1) + '%'}` } } }, scales: { x: { grid: { display: false } }, y: { ticks: { callback: (v) => v + '%' } } } }
    }); else noData('#pRate');
    if (tgtVals.length) chart($('#pTgt'), {
      type: 'line',
      data: { labels: M, datasets: Object.entries(tgtGroups).map(([l, d], i) => ({ label: l, data: d, borderColor: [c4, c3, c1, c2][i % 4], backgroundColor: [c4, c3, c1, c2][i % 4], tension: .3, pointRadius: 3, spanGaps: true })) },
      options: { ...base, plugins: { legend: { display: Object.keys(tgtGroups).length > 1, position: 'bottom', labels: { boxWidth: 10, boxHeight: 10 } }, tooltip: { callbacks: { label: (c) => c.parsed.y == null ? null : ` ${c.dataset.label} ${c.parsed.y}%` } } }, scales: { x: { grid: { display: false } }, y: { suggestedMin: Math.floor(Math.min(...tgtVals) - 2), suggestedMax: Math.ceil(Math.max(...tgtVals) + 2), ticks: { callback: (v) => v + '%' } } } }
    }); else noData('#pTgt');
  }

  /* ================= 메인 요약 카드 ================= */
  // 다른 탭 데이터를 조용히 불러옴 (실패하면 null → 그 카드는 숨김)
  async function quietLoad(type) {
    const cat = state.creator.categories.find((c) => c.type === type);
    if (!cat) return null;
    const maxAge = Math.max(1, CFG.refreshMinutes || 5) * 60000;
    const c = state.cache[cat.id];
    if (c && (c.source === 'upload' || Date.now() - c.at < maxAge)) return c.rows;
    let entry = null;
    if (cat.url) { try { entry = { rows: P.parseCSV(await fetchCSV(cat.url)), source: 'url', at: new Date() }; } catch (e) { /* 아래 예비 데이터 */ } }
    if (!entry && cat.fallback) entry = { rows: P.parseCSV(cat.fallback.text), source: 'file', name: cat.fallback.asOf, at: new Date(), sheetErr: true };
    if (!entry) return c ? c.rows : null;
    state.cache[cat.id] = entry;
    return entry.rows;
  }
  const safe = (fn) => { try { return fn(); } catch (e) { return null; } };
  const nk = (s) => String(s || '').replace(/\s+/g, '').toLowerCase();
  async function renderSummary(ev) {
    const box = $('#summary');
    if (!box) return;
    box.innerHTML = '<div class="summary-head"><h2>📋 한눈에 보기</h2><span class="hint">불러오는 중…</span></div>';
    const [inqRows, dealRows, perfRows] = await Promise.all(['inquiries', 'deals', 'performance'].map((t) => quietLoad(t).catch(() => null)));
    if (!document.body.contains(box)) return; // 그 사이 탭을 옮긴 경우
    const t0 = today();
    const inq = inqRows && safe(() => P.parseInquiries(inqRows).items);
    const deals = dealRows && safe(() => P.parseDeals(dealRows).items);
    const perf = perfRows && safe(() => P.parsePerformance(perfRows, state.creator.name));
    const cards = [];

    // ② 이번 달 일정 (광고 = 광고 확정 건 시트에 있는 브랜드의 일정)
    {
      const mine = ev.filter((e) => e.date.getFullYear() === t0.getFullYear() && e.date.getMonth() === t0.getMonth());
      const dealKeys = (deals || []).map((d) => nk(d.brand)).filter((k) => k.length >= 2);
      const isAd = (e) => dealKeys.length
        ? dealKeys.some((k) => { const b = nk(e.brand); return b === k || (b.length >= 2 && (b.includes(k) || k.includes(b))); })
        : e.type !== 'other';
      const ads = mine.filter(isAd).length;
      cards.push(kpi(`🗓️ ${t0.getMonth() + 1}월 일정`, `${mine.length}<small>건</small>`, mine.length ? `광고 ${ads}건 포함${dealKeys.length ? '' : ' (작업 단계 기준)'}` : (ev.length ? '이번 달 등록된 일정 없음' : '스케줄에 등록된 일정 없음')));
    }

    // ③ 광고·공구 문의 (유형별)
    if (inq && inq.length) {
      const order = ['광고(PPL)', '선제안', '공구마켓', '공동구매', '단순선물'];
      const cnt = {}; inq.forEach((x) => { cnt[x.type] = (cnt[x.type] || 0) + 1; });
      const keys = [...order.filter((k) => cnt[k]), ...Object.keys(cnt).filter((k) => !order.includes(k)).sort((a, b) => cnt[b] - cnt[a])];
      cards.push(kpi('📨 광고·공구 문의', `${inq.length.toLocaleString()}<small>건</small>`, keys.map((k) => `${esc(k)} ${cnt[k]}`).join(' · ')));
    }

    // ④ 광고 매출 합계 (VAT 제외)
    if (deals && deals.length) {
      const priced = deals.filter((d) => d.price != null);
      const total = priced.reduce((s, d) => s + d.price, 0);
      const isDone = (d) => (d.upload && d.upload < t0) || (!d.upload && !!d.channelUrl);
      const doneSum = priced.filter(isDone).reduce((s, d) => s + d.price, 0);
      const missing = deals.length - priced.length;
      cards.push(kpi('💰 광고 매출 합계 <small class="vat">VAT 제외</small>', priced.length ? wonShort(total) : '–',
        `확정 ${deals.length}건 · 업로드 완료 ${priced.length ? won(doneSum) : '–'}${missing ? ` · 단가 미입력 ${missing}건` : ''}`));
    }

    // 팔로워·조회수: 월별로 더하지 않고 가장 최근 달 값 + 직전 달 대비
    const latest = (m) => {
      const pts = m.months.map((x, k) => ({ k, v: x.num })).filter((x) => x.v != null);
      if (!pts.length) return null;
      const last = pts[pts.length - 1], prev = pts.length > 1 ? pts[pts.length - 2] : null;
      let delta = '전월 데이터 없음';
      if (prev) {
        const d = last.v - prev.v, pct = prev.v ? (d / prev.v) * 100 : 0;
        const gap = last.k - prev.k > 1 ? ` (${prev.k + 1}월 대비)` : ' (전월 대비)';
        delta = d === 0 ? `변동 없음${gap}` : `${d > 0 ? '▲' : '▼'} ${Math.abs(d).toLocaleString()} · ${Math.abs(pct) < 10 ? Math.abs(pct).toFixed(1) : Math.round(Math.abs(pct))}%${gap}`;
      }
      return { last, delta };
    };
    const big = (n) => (n >= 1e8 ? (n / 1e8).toFixed(1).replace(/\.0$/, '') + '<small>억</small>' : n >= 1e6 ? Math.round(n / 1e4).toLocaleString() + '<small>만</small>' : n.toLocaleString());
    if (perf && perf.metrics) {
      const views = perf.metrics.find((m) => /조회/.test(m.name));
      const lv = views && latest(views);
      if (lv) var viewCard = kpi(`▶️ 현재 ${esc(views.name)}`, big(lv.last.v), `${lv.last.k + 1}월 기준 · ${lv.last.v >= 1e6 ? lv.last.v.toLocaleString() + '회 · ' : ''}${lv.delta}`);
    }
    // ④ 현재 팔로워·구독자
    if (perf && perf.metrics) {
      const subs = perf.metrics.filter((m) => /팔로워|구독자/.test(m.name)).map((m) => {
        const pts = m.months.map((x, k) => ({ k, v: x.num })).filter((x) => x.v != null);
        if (!pts.length) return null;
        const last = pts[pts.length - 1], prev = pts.length > 1 ? pts[pts.length - 2] : null;
        return { name: m.name, last, prev };
      }).filter(Boolean);
      if (subs.length) {
        const s0 = subs[0];
        let delta = '전월 데이터 없음';
        if (s0.prev) {
          const d = s0.last.v - s0.prev.v, pct = s0.prev.v ? (d / s0.prev.v) * 100 : 0;
          const gap = s0.last.k - s0.prev.k > 1 ? ` (${s0.prev.k + 1}월 대비)` : ' (전월 대비)';
          delta = d === 0 ? `변동 없음${gap}` : `${d > 0 ? '▲' : '▼'} ${Math.abs(d).toLocaleString()} · ${Math.abs(pct) < 10 ? Math.abs(pct).toFixed(1) : Math.round(Math.abs(pct))}%${gap}`;
        }
        const others = subs.slice(1).map((s) => ` · ${esc(s.name)} ${s.last.v.toLocaleString()}`).join('');
        cards.push(kpi(`👥 현재 ${esc(s0.name)}`, s0.last.v.toLocaleString(), `${s0.last.k + 1}월 기준 · ${delta}${others}`));
      }
    }
    if (typeof viewCard !== 'undefined' && viewCard) cards.push(viewCard);

    if (!cards.length) { box.remove(); return; }
    box.innerHTML = `<div class="summary-head"><h2>📋 한눈에 보기</h2><span class="hint">각 탭 시트에서 자동 계산</span></div><div class="summary">${cards.join('')}</div>`;
  }

  /* ================= 광고 확정 건 ================= */
  const won = (n) => (n == null ? '–' : '₩' + Math.round(n).toLocaleString('ko-KR'));
  function wonShort(n) {
    if (n == null) return '–';
    if (Math.abs(n) >= 1e8) return (n / 1e8).toFixed(1).replace(/\.0$/, '') + '<small>억 원</small>';
    if (Math.abs(n) >= 1e4) return Math.round(n / 1e4).toLocaleString('ko-KR') + '<small>만 원</small>';
    return n.toLocaleString('ko-KR') + '<small>원</small>';
  }
  function renderDeals(rows, head) {
    const R = P.parseDeals(rows);
    const t0 = today();
    const items = R.items;
    const priced = items.filter((x) => x.price != null);
    const total = priced.reduce((s, x) => s + x.price, 0);
    const postedNoDate = (x) => !x.upload && !!x.channelUrl;
    const done = items.filter((x) => (x.upload && x.upload < t0) || postedNoDate(x));
    const upcoming = items.filter((x) => x.upload && x.upload >= t0).sort((a, b) => a.upload - b.upload);
    const keeping = items.filter((x) => x.keepEnd && x.keepEnd >= t0).sort((a, b) => a.keepEnd - b.keepEnd);
    const ym = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    const mLabel = (k) => `${+k.slice(5)}월`;
    // 첫 업로드 달 ~ 마지막 업로드 달을 빠짐없이 (업로드 없는 달은 0)
    const ups = items.filter((x) => x.upload).map((x) => x.upload).sort((a, b) => a - b);
    const months = [];
    if (ups.length) for (let d = new Date(ups[0].getFullYear(), ups[0].getMonth(), 1); d <= ups[ups.length - 1]; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) months.push(ym(d));
    // 확인이 필요한 데이터
    const issues = [];
    items.filter((x) => x.upload && x.date && x.upload < x.date).forEach((x) => issues.push(`${x.row}행 ${esc(x.brand)}: 업로드일(${esc(x.uploadRaw)})이 문의일(${esc(x.rawDate)})보다 빨라요`));
    const noUrlLink = items.filter((x) => /링크/.test(x.channelRaw) && !x.channelUrl).length;
    const noDate = items.filter((x) => !x.upload);
    if (noDate.length) issues.push(`업로드일 미입력 ${noDate.length}건: ${noDate.map((x) => esc(x.brand) + (x.channelUrl ? '(게시물 링크 있음)' : '')).join(', ')} — 게시 유지기간 종료일을 계산하려면 업로드일이 필요해요`);
    if (noUrlLink) issues.push(`업로드 채널 ${noUrlLink}칸이 "[링크]" 글자만 있고 주소가 없어요 (시트의 링크 칩은 CSV에 주소가 안 나와요)`);
    const noUrlContract = items.filter((x) => x.contractRaw && !x.contractUrl);
    if (noUrlContract.length) issues.push(`계약서 칸 ${noUrlContract.length}개에 주소 없이 글자만 있어요: ${noUrlContract.map((x) => esc(x.brand)).join(', ')}`);

    $('#view').innerHTML = head +
      (R.notes.length ? `<div class="notice deal-note"><details open><summary>🚫 ${esc(R.notes[0].split('\n')[0].replace(/[\[\]]/g, ''))}</summary><div style="margin-top:8px">${esc(R.notes.map((n, i) => (i === 0 ? n.split('\n').slice(1).join('\n') : n)).join('\n\n').trim())}</div></details></div>` : '') +
      (issues.length ? `<div class="banner" style="margin-top:12px">ℹ️ 시트 확인 필요 — ${issues.join(' / ')}</div>` : '') + `
      <div class="kpis">
        ${kpi('✅ 광고 확정', `${items.length}<small>건</small>`, `업로드 완료 ${done.length} · 예정 ${upcoming.length}`, true)}
        ${kpi('💰 확정 금액 합계', priced.length ? wonShort(total) : '–', `${won(total)} · 단가 입력 ${priced.length}건 / 미입력 ${items.length - priced.length}건`)}
        ${upcoming.length ? kpi('🚀 다음 업로드', dday(upcoming[0].upload), `${mdw(upcoming[0].upload)} · ${esc(upcoming[0].brand)}`) : kpi('🚀 다음 업로드', '없음', '예정된 업로드가 없어요')}
        ${kpi('📌 게시물 유지 중', `${keeping.length}<small>건</small>`, keeping.length ? `가장 빠른 종료: ${esc(keeping[0].brand)} ${md(keeping[0].keepEnd)} (업로드일 + 유지기간)` : '유지기간 중인 게시물 없음')}
      </div>
      <div class="grid-2" style="margin-top:12px">
        <div class="panel"><h3>월별 업로드 · 확정 금액 <span style="font-weight:400;color:var(--muted);font-size:12px">· 업로드일 기준</span></h3><div class="chart-box"><canvas id="dMonth"></canvas></div></div>
        <div class="panel"><h3>요청 플랫폼</h3><div class="chart-box"><canvas id="dPlat"></canvas></div></div>
      </div>
      <div class="section-title"><h2>확정 건 목록</h2><span class="hint" id="dCount"></span></div>
      <div class="toolbar">
        <input id="dq" type="search" placeholder="브랜드 · 제품 · 대행사 검색">
        <select id="df"><option value="">전체</option><option value="up">업로드 예정</option><option value="done">업로드 완료</option><option value="keep">게시물 유지 중</option><option value="noprice">단가 미입력</option></select>
      </div>
      <div class="table-wrap"><table>
        <thead><tr id="dthead"><th>업로드일</th><th>상태</th><th>브랜드</th><th>대행사</th><th>카테고리</th><th>제품명</th><th>요청 플랫폼</th><th>진행 단가</th><th>게시 유지기간</th></tr></thead>
        <tbody id="dbody"></tbody></table></div>`;

    const c1 = cssVar('--accent'), c2 = cssVar('--upload');
    chart($('#dMonth'), {
      data: { labels: months.map(mLabel), datasets: [
        { type: 'bar', label: '업로드 건수', data: months.map((m) => items.filter((x) => x.upload && ym(x.upload) === m).length), backgroundColor: c1, borderRadius: 4, maxBarThickness: 34, yAxisID: 'y', order: 2 },
        { type: 'line', label: '확정 금액', data: months.map((m) => items.filter((x) => x.upload && ym(x.upload) === m && x.price != null).reduce((s, x) => s + x.price, 0)), borderColor: c2, backgroundColor: c2, tension: .3, pointRadius: 3, yAxisID: 'y1', order: 1 }
      ] },
      options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
        scales: { x: { grid: { display: false } }, y: { position: 'left', ticks: { precision: 0 } }, y1: { position: 'right', grid: { display: false }, ticks: { callback: (v) => (v >= 1e4 ? v / 1e4 + '만' : v) } } },
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, boxHeight: 10 } }, tooltip: { callbacks: { label: (c) => ` ${c.dataset.label}: ${c.dataset.yAxisID === 'y1' ? won(c.parsed.y) + ' (단가 입력 건만)' : c.parsed.y + '건'}` } } } }
    });
    const plat = {};
    items.forEach((x) => x.platform.split(/[,/]/).map((s) => s.trim()).filter(Boolean).forEach((s) => { plat[s] = (plat[s] || 0) + 1; }));
    hbar($('#dPlat'), Object.entries(plat).sort((a, b) => b[1] - a[1]), c1);

    const hasReuse = R.cols.reuse >= 0;
    if (hasReuse) {
      $('#dthead').insertAdjacentHTML('beforeend', '<th>2차 활용</th>');
      $('#df').insertAdjacentHTML('beforeend', '<option value="reuse">2차 활용 중</option>');
    }
    $('#dthead').insertAdjacentHTML('beforeend', '<th>계약서</th>');
    const hasInsight = R.cols.insight >= 0; // "게시물 인사이트" 열이 있을 때만 표시
    if (hasInsight) {
      $('#dthead').insertAdjacentHTML('beforeend', '<th>게시물 인사이트</th>');
      $('#df').insertAdjacentHTML('beforeend', '<option value="noinsight">인사이트 미입력 (업로드 완료 건)</option>');
    }
    // 링크면 버튼, 글·숫자면 그대로 (링크와 글이 섞여 있으면 둘 다)
    const insightCell = (x) => {
      if (!x.insightRaw) return '<span class="muted-sm">미입력</span>';
      const btns = x.insightUrls.slice(0, 3).map((u, i) => `<a class="doc-btn" href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="${esc(u)}">📊 인사이트${x.insightUrls.length > 1 ? ' ' + (i + 1) : ' 보기'}</a>`).join(' ');
      const text = x.insightUrls.reduce((s, u) => s.split(u).join(''), x.insightRaw).trim();
      return `${btns}${text ? `<div class="insight-text">${esc(text)}</div>` : ''}`;
    };
    const period = (raw, end) => (raw ? `${esc(raw)}${end ? `<br><small style="color:var(--muted)">~${end.getMonth() + 1}/${end.getDate()} ${end >= t0 ? '진행 중' : '종료'}</small>` : ''}` : '');
    const sorted = [...items].sort((a, b) => (b.upload || 0) - (a.upload || 0));
    const draw = () => {
      const q = $('#dq').value.trim().toLowerCase(), f = $('#df').value;
      const list = sorted.filter((x) => (!q || [x.brand, x.product, x.agency, x.category].join(' ').toLowerCase().includes(q)) &&
        (!f || (f === 'up' && x.upload && x.upload >= t0) || (f === 'done' && ((x.upload && x.upload < t0) || postedNoDate(x))) || (f === 'keep' && x.keepEnd && x.keepEnd >= t0) || (f === 'reuse' && x.reuseEnd && x.reuseEnd >= t0) || (f === 'noprice' && x.price == null) || (f === 'noinsight' && !x.insightRaw && ((x.upload && x.upload < t0) || (!x.upload && !!x.channelUrl)))));
      $('#dCount').textContent = `${list.length}건`;
      $('#dbody').innerHTML = list.map((x) => {
        const status = postedNoDate(x) ? '<span class="pill t-upload">완료</span><br><small style="color:var(--muted)">날짜 미입력</small>' : !x.upload ? '<span class="pill t-other">미정</span>' : x.upload >= t0 ? `<span class="pill t-final">예정 ${dday(x.upload)}</span>` : '<span class="pill t-upload">완료</span>';
        const keep = period(x.keepRaw, x.keepEnd);
        const contract = x.contractUrl ? `<a class="doc-btn" href="${esc(x.contractUrl)}" target="_blank" rel="noopener noreferrer">📄 보기</a>` : x.contractRaw ? `<span class="muted-sm">${esc(x.contractRaw)} (주소 없음)</span>` : '<span class="muted-sm">미첨부</span>';
        return `<tr>
          <td class="nowrap" data-label="업로드일">${x.upload ? `${x.upload.getFullYear() % 100}.${x.upload.getMonth() + 1}.${x.upload.getDate()}` : esc(x.uploadRaw || '—')}</td>
          <td data-label="상태">${status}</td>
          <td class="brandcell" data-label="브랜드"><b>${esc(x.brand)}</b>${x.channelUrl ? `<br><a class="doc-btn" style="margin-top:4px" href="${esc(x.channelUrl)}" target="_blank" rel="noopener noreferrer" title="업로드된 게시물 열기">▶ 게시물</a>` : ''}</td>
          <td data-label="대행사">${esc(x.agency)}</td>
          <td data-label="카테고리">${esc(x.category)}</td>
          <td class="wrap" data-label="제품명">${esc(x.product)}</td>
          <td data-label="플랫폼">${esc(x.platform)}</td>
          <td class="nowrap" data-label="진행 단가">${x.price != null ? won(x.price) : '<span class="muted-sm">미입력</span>'}</td>
          <td class="nowrap" data-label="게시 유지">${keep}</td>
          ${hasReuse ? `<td class="nowrap" data-label="2차 활용">${period(x.reuseRaw, x.reuseEnd)}</td>` : ''}
          <td data-label="계약서">${contract}</td>
          ${hasInsight ? `<td class="wrap insight-cell" data-label="인사이트">${insightCell(x)}</td>` : ''}
        </tr>`;
      }).join('') || `<tr><td colspan="${10 + (hasReuse ? 1 : 0) + (hasInsight ? 1 : 0)}" class="empty">조건에 맞는 건이 없어요</td></tr>`;
    };
    $('#dq').oninput = draw; $('#df').onchange = draw; draw();
  }

  /* ================= 콘텐츠 기획 ================= */
  // 셀 안의 http(s) 주소는 새 창으로 열리는 링크로 바꿈 (그 외 글자는 그대로 이스케이프)
  function linkify(text) {
    return String(text || '').split(/(https?:\/\/[^\s<>"']+)/g).map((part, i) =>
      i % 2 ? `<a href="${esc(part)}" target="_blank" rel="noopener noreferrer">${esc(part.replace(/^https?:\/\/(www\.)?/, '').slice(0, 48))}${part.replace(/^https?:\/\/(www\.)?/, '').length > 48 ? '…' : ''}</a>` : esc(part)).join('');
  }
  function renderPlan(rows, head) {
    const R = P.parsePlan(rows);
    const fieldNames = R.header.filter((h) => h !== R.titleCol);
    const total = R.items.length * fieldNames.length;
    const filled = R.items.reduce((s, it) => s + it.fields.filter((f) => f.value).length, 0);
    const links = R.items.reduce((s, it) => s + it.fields.reduce((t, f) => t + (f.value.match(/https?:\/\//g) || []).length, 0), 0);
    const missing = {};
    R.items.forEach((it) => it.fields.forEach((f) => { if (!f.value) missing[f.name] = (missing[f.name] || 0) + 1; }));
    const icon = (n) => (/왜|목적|목표|이유/.test(n) ? '🎯' : /타겟|타깃/.test(n) ? '👥' : /컨셉/.test(n) ? '💡' : /플롯|구성|흐름/.test(n) ? '🎬' : /레퍼런스|참고/.test(n) ? '🔗' : '📝');
    $('#view').innerHTML = head + `
      <div class="kpis">
        ${kpi('💡 기획 콘텐츠', `${R.items.length}<small>개</small>`, `${esc(R.titleCol)} 기준`, true)}
        ${kpi('✍️ 작성률', total ? `${Math.round((filled / total) * 100)}<small>%</small>` : '–', total ? `${filled} / ${total}칸 작성` : `항목: ${fieldNames.map(esc).join(' · ')}`)}
        ${kpi('🔗 레퍼런스', `${links}<small>개</small>`, '셀 안의 링크 수')}
        ${kpi('📝 비어 있는 항목', `${Object.values(missing).reduce((a, b) => a + b, 0)}<small>칸</small>`, R.items.length ? (Object.keys(missing).map(esc).join(', ') || '모두 작성됨') : '아직 등록된 기획이 없어요')}
      </div>
      <div class="section-title"><h2>기획 목록</h2><span class="hint">${R.items.length}개</span></div>
      <div class="plans">${R.items.map((it) => `
        <article class="plan-card">
          <h3>${esc(it.title)}</h3>
          <div class="plan-fields">${it.fields.map((f) => `
            <div class="plan-field${f.value ? '' : ' blank'}${/레퍼런스|참고/.test(f.name) ? ' wide' : ''}">
              <span>${icon(f.name)} ${esc(f.name)}</span>
              <div>${f.value ? linkify(f.value) : '미작성'}</div>
            </div>`).join('')}
          </div>
          <div class="plan-row">시트 ${it.row}행</div>
        </article>`).join('') || '<div class="empty">등록된 기획이 없어요</div>'}
      </div>`;
  }

  /* ================= 기타 CSV: 자동 표 ================= */
  function renderTable(rows, head) {
    const T = P.parseGenericTable(rows);
    if (!T.header.length) throw new Error('표 형태의 데이터를 찾지 못했습니다.');
    $('#view').innerHTML = head + `
      <div class="kpis">${kpi('📄 데이터 행', `${T.rows.length}<small>행</small>`, `${T.header.length}개 열`, true)}</div>
      <div class="section-title"><h2>${esc(state.cat.title)}</h2><span class="hint" id="cnt"></span></div>
      <div class="toolbar"><input id="q" type="search" placeholder="검색"></div>
      <div class="table-wrap"><table><thead><tr>${T.header.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody id="tb"></tbody></table></div>`;
    const draw = () => {
      const q = $('#q').value.trim().toLowerCase();
      const list = T.rows.filter((r) => !q || r.join(' ').toLowerCase().includes(q));
      $('#cnt').textContent = `${list.length}행`;
      $('#tb').innerHTML = list.slice(0, 300).map((r) => `<tr>${r.map((c, i) => `<td class="wrap" data-label="${esc(T.header[i])}">${esc(c)}</td>`).join('')}</tr>`).join('');
    };
    $('#q').oninput = draw; draw();
  }

  document.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
</html>
